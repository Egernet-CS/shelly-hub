<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Simple">
  <title>Simple</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a id="back" class="icon-btn" href="#" data-i18n-aria="back" hidden>‹</a>
    <h1 id="title" data-i18n="home">Home</h1>
    <span id="conn" class="conn" data-state="connecting" data-i18n="connecting">Connecting…</span>
    <a id="settings-link" class="icon-btn" href="#settings" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </a>
  </header>

  <p id="status" class="status" role="status" hidden></p>

  <main id="rooms" class="rooms" aria-live="polite"></main>
  <main id="settings" class="settings" hidden></main>

  <template id="room-tpl">
    <section class="room">
      <h2 class="room-name"></h2>
      <div class="tiles"></div>
    </section>
  </template>

  <template id="tile-tpl">
    <article class="tile">
      <button class="tile-toggle" type="button" aria-pressed="false">
        <span class="bulb" aria-hidden="true"></span>
        <span class="tile-text">
          <span class="tile-name"></span>
          <span class="tile-status"></span>
        </span>
      </button>
      <input class="dimmer" type="range" min="1" max="100" step="1" data-i18n-aria="brightness" hidden>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
